[package]
name = "read-core"
version = "0.1.0"
edition = "2021"
authors = ["Renan <architect@read-framework.org>"]
description = "READ Core Computational Engine: State, AST Context Resolver, Hasher, and Bounded Mutation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.test]
opt-level = 1

[[bin]]
name = "read-engine"
path = "src/main.rs"

[lib]
name = "read_core"
path = "src/lib.rs"
