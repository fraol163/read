[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "read-mcp"
version = "0.1.0"
description = "Universal Model Context Protocol (MCP) Server for the READ Framework"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "READ Methodology Team" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = []
requires-python = ">=3.8"

[project.scripts]
read-mcp = "read_mcp:main"

[tool.setuptools]
py-modules = ["read_mcp", "harness_setup"]

[tool.setuptools.package-data]
"*" = ["skills/**/*", "bin/*", "template/**/*", "config.default.json"]
