name: READ Framework CI and Verification Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build, Test and Verify READ Framework
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Native Binaries
        run: |
          mkdir -p bin
          cargo build --release --manifest-path read-core/Cargo.toml
          TARGET_DIR=$(cargo metadata --format-version 1 --manifest-path read-core/Cargo.toml --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          if [ -f "${TARGET_DIR}/release/read-engine" ]
          then
            cp "${TARGET_DIR}/release/read-engine" bin/read-engine
          elif [ -f "read-core/target/release/read-engine" ]
          then
            cp read-core/target/release/read-engine bin/read-engine
          elif [ -f "target/release/read-engine" ]
          then
            cp target/release/read-engine bin/read-engine
          fi
          chmod +x bin/read-engine bin/read
          cd read-daemon && go build -trimpath -o ../bin/read-daemon ./cmd/read-daemon && cd ..
          chmod +x bin/read-daemon
          chmod +x bin/read-mcp

      - name: Run Rust Core Unit Tests
        run: cargo test --manifest-path read-core/Cargo.toml

      - name: Run Go Daemon Unit Tests
        run: cd read-daemon && go test -v ./...

      - name: Verify All 24 Commands
        run: bash tests/test_all_commands.sh

      - name: Run Packaging and E2E Tests
        run: |
          bash tests/test_packaging.sh
          bash tests/test_e2e.sh

      - name: Run CI Gate Simulation
        run: bash evidence/test_ci_workflow.sh
