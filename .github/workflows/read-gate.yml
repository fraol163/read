name: READ Framework Verification Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-gate:
    name: Enforce READ Verification Invariant
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build READ Engine
        run: |
          cargo build --release --manifest-path read/read-core/Cargo.toml
          mkdir -p bin
          cp read/read-core/target/release/read-core bin/read-engine

      - name: Verify State and Contract Integrity
        run: |
          if [ ! -f ".read/STATE.json" ] && [ ! -f ".method/STATE.json" ]
          then
            echo "[ERROR] No READ state found. Commits must be processed by READ."
            exit 1
          fi

      - name: Verify Cryptographic WAL Git Tag Anchor
        run: |
          ./bin/read-engine verify-wal-anchor || {
            echo "[SECURITY ERROR] WAL git tag anchor verification failed. WAL may be tampered."
            exit 1
          }

      - name: Enforce Sealed State Handoff
        run: |
          STATUS=$(./bin/read-engine status | grep '"status":' | tr -d '", ' | cut -d: -f2)
          echo "Current READ State: $STATUS"
          if [ "$STATUS" != "handoff_complete" ] && [ "$STATUS" != "verified" ]
          then
            echo "[GATE FAILED] Commit was made without passing the READ verification gate."
            echo "Direct git commit --no-verify bypasses are mechanically rejected on CI."
            exit 1
          fi
